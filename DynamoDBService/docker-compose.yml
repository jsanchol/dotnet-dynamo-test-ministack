services:
  ministack:
    image: ministackorg/ministack:latest
    ports:
      - "4566:4566"
    environment:
      SERVICES: dynamodb
    volumes:
      - ministack-data:/tmp/ministack-data

  dynamodb-service:
    build: ./DynamoDBService
    depends_on:
      - ministack
    environment:
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      AWS_DEFAULT_REGION: us-east-1
      DYNAMODB_ENDPOINT: http://ministack:4566

volumes:
  ministack-data: